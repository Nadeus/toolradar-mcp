startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      toolradarApiKey:
        type: string
        description: "Optional. Works without a key (500 calls a day). A free key, no signup (POST https://toolradar.com/api/v1/keys), raises it to 10,000 a day."
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "toolradar-mcp"],
      env: config.toolradarApiKey ? { TOOLRADAR_API_KEY: config.toolradarApiKey } : {}
    })
